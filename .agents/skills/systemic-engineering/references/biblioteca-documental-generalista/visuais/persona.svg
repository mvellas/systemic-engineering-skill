<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Ficha de persona</title><desc id="desc">Cabeçalho com arquétipo e base de evidência; cartão de contexto, tarefas, dores, critérios e canais. Retrato não ocupa mais espaço que as informações decisórias. Esquema generalista preenchível; não representa dados de um negócio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6b858b" /></marker></defs><rect width="1200" height="760" fill="white" /><text x="40" y="45" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">DOC-08 / Persona e papéis de compra</text><text x="40" y="76" font-family="Arial, sans-serif" fill="#57626a" font-size="15">MODELO GENERALISTA · editar campos e repetir elementos conforme o escopo</text><circle cx="175" cy="215" r="75" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="125" y="222" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Avatar]</text><rect x="310" y="130" width="840" height="160" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="326" y="160" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Arquétipo e contexto]</text><text x="326" y="252" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Pesquisa / síntese / hipótese]</text><rect x="45" y="345" width="350" height="270" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="61" y="375" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Tarefas e objetivos</text><text x="61" y="577" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Registro + evidência]</text><rect x="430" y="345" width="350" height="270" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="446" y="375" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Dores e objeções</text><text x="446" y="577" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Registro + evidência]</text><rect x="815" y="345" width="350" height="270" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="831" y="375" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Critérios e canais</text><text x="831" y="577" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Registro + evidência]</text><text x="40" y="730" font-family="Arial, sans-serif" fill="#57626a" font-size="15">Esquema de composição · campos entre colchetes são placeholders · sem dados empíricos</text></svg>