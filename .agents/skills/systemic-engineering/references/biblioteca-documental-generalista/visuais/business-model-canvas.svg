<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Canvas em nove blocos</title><desc id="desc">Parceiros à esquerda; atividades/recursos; valor ao centro; relacionamento/canais; segmentos à direita. Custos e receitas na faixa inferior. Cada item pode carregar um marcador de evidência. Esquema generalista preenchível; não representa dados de um negócio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6b858b" /></marker></defs><rect width="1200" height="760" fill="white" /><text x="40" y="45" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">DOC-04 / Business Model Canvas</text><text x="40" y="76" font-family="Arial, sans-serif" fill="#57626a" font-size="15">MODELO GENERALISTA · editar campos e repetir elementos conforme o escopo</text><rect x="40" y="110" width="215" height="420" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="56" y="140" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Parcerias-chave</text><text x="56" y="492" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Item + segmento +</text><text x="56" y="511" font-family="Arial, sans-serif" fill="#57626a" font-size="15">evidência]</text><rect x="265" y="110" width="215" height="205" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="281" y="140" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Atividades-chave</text><text x="281" y="277" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Item + segmento +</text><text x="281" y="296" font-family="Arial, sans-serif" fill="#57626a" font-size="15">evidência]</text><rect x="265" y="325" width="215" height="205" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="281" y="355" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Recursos-chave</text><text x="281" y="492" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Item + segmento +</text><text x="281" y="511" font-family="Arial, sans-serif" fill="#57626a" font-size="15">evidência]</text><rect x="490" y="110" width="215" height="420" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="506" y="140" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Propostas de valor</text><text x="506" y="492" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Item + segmento +</text><text x="506" y="511" font-family="Arial, sans-serif" fill="#57626a" font-size="15">evidência]</text><rect x="715" y="110" width="215" height="205" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="731" y="140" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Relacionamentos</text><text x="731" y="277" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Item + segmento +</text><text x="731" y="296" font-family="Arial, sans-serif" fill="#57626a" font-size="15">evidência]</text><rect x="715" y="325" width="215" height="205" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="731" y="355" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Canais</text><text x="731" y="492" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Item + segmento +</text><text x="731" y="511" font-family="Arial, sans-serif" fill="#57626a" font-size="15">evidência]</text><rect x="940" y="110" width="220" height="420" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="956" y="140" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Segmentos</text><text x="956" y="492" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Item + segmento +</text><text x="956" y="511" font-family="Arial, sans-serif" fill="#57626a" font-size="1