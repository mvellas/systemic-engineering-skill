<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Fases com gates e controle transversal</title><desc id="desc">Blocos de fase conectados com marcadores de decisão entre eles; uma faixa abaixo representa monitoramento contínuo. Iterações devem aparecer como retorno explícito. Esquema generalista preenchível; não representa dados de um negócio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6b858b" /></marker></defs><rect width="1200" height="760" fill="white" /><text x="40" y="45" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">DOC-12 / Ciclo de vida do projeto</text><text x="40" y="76" font-family="Arial, sans-serif" fill="#57626a" font-size="15">MODELO GENERALISTA · editar campos e repetir elementos conforme o escopo</text><rect x="45" y="220" width="250" height="175" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="61" y="250" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Definir</text><text x="61" y="357" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Saída + responsável]</text><path d="M295,300 L335,300" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><rect x="335" y="220" width="250" height="175" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="351" y="250" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Planejar</text><text x="351" y="357" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Saída + responsável]</text><path d="M585,300 L625,300" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><rect x="625" y="220" width="250" height="175" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="641" y="250" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Entregar</text><text x="641" y="357" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Saída + responsável]</text><path d="M875,300 L915,300" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><rect x="915" y="220" width="250" height="175" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="931" y="250" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Transição</text><text x="931" y="357" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Saída + responsável]</text><rect x="45" y="475" width="1110" height="120" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="61" y="505" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Monitoramento e decisões</text><text x="61" y="557" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Evidência + limiar + responsável + próxima ação]</text><text x="40" y="730" font-family="Arial, sans-serif" fill="#57626a" font-size="15">Esquema de composição · campos entre colchetes são placeholders · sem dados empíricos</text></svg>