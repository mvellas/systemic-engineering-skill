<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Matriz RACI</title><desc id="desc">Entregas em linhas e papéis em colunas; letras grandes, legenda textual e contraste. Marcar ausência de A ou R como pendência, sem atribuição automática. Esquema generalista preenchível; não representa dados de um negócio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6b858b" /></marker></defs><rect width="1200" height="760" fill="white" /><text x="40" y="45" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">DOC-14 / Matriz de responsabilidades — RACI</text><text x="40" y="76" font-family="Arial, sans-serif" fill="#57626a" font-size="15">MODELO GENERALISTA · editar campos e repetir elementos conforme o escopo</text><rect x="45" y="125" width="340" height="95" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="61" y="155" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Entrega / decisão</text><rect x="405" y="125" width="240" height="95" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="421" y="155" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Papel A]</text><rect x="655" y="125" width="240" height="95" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="671" y="155" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Papel B]</text><rect x="905" y="125" width="240" height="95" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="921" y="155" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Papel C]</text><rect x="45" y="230" width="340" height="95" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="61" y="260" font-family="Arial, sans-serif" fill="#20282c" font-size="18