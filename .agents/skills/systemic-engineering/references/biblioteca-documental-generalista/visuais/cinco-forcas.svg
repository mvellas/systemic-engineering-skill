<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Mapa de cinco forças</title><desc id="desc">Rivalidade ao centro; entrantes acima, substitutos abaixo, fornecedores à esquerda e compradores à direita. Rótulos de intensidade e síntese; setas indicam pressão, não fluxo financeiro. Esquema generalista preenchível; não representa dados de um negócio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6b858b" /></marker></defs><rect width="1200" height="760" fill="white" /><text x="40" y="45" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">DOC-10 / Cinco forças competitivas</text><text x="40" y="76" font-family="Arial, sans-serif" fill="#57626a" font-size="15">MODELO GENERALISTA · editar campos e repetir elementos conforme o escopo</text><rect x="420" y="320" width="360" height="115" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="436" y="350" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Rivalidade</text><text x="436" y="397" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Intensidade + mecanismo]</text><rect x="420" y="120" width="340" height="115" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="436" y="150" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Novos entrantes</text><text x="436" y="197" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Pressão e evidência]</text><rect x="420" y="535" width="340" height="115" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="436" y="565" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Substitutos</text><text x="436" y="612" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Pressão e evidência]</text><rect x="40" y="320" width="340" height="115" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="56" y="350" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Fornecedores</text><text x="56" y="397" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Pressão e evidência]</text><rect x="820" y="320" width="340" height="115" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="836" y="350" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Compradores</text><text x="836" y="397" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Pressão e evidência]</text><path d="M600,235 L600,320" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><path d="M600,535 L600,435" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><path d="M380,375 L420,375" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><path d="M820,375 L780,375" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><text x="40" y="730" font-family="Arial, sans-serif" fill="#57626a" font-size="15">Esquema de composição · campos entre colchetes são placeholders · sem dados empíricos</text></svg>