<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Mapa de encaixe de valor</title><desc id="desc">Perfil do cliente à direita com tarefas, dores e ganhos; oferta à esquerda com produtos/serviços, aliviadores e criadores. Conexões por IDs evidenciam correspondência. Não exigir correspondência artificial para todos os itens. Esquema generalista preenchível; não representa dados de um negócio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6b858b" /></marker></defs><rect width="1200" height="760" fill="white" /><text x="40" y="45" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">DOC-22 / Proposta de valor e mapa de encaixe</text><text x="40" y="76" font-family="Arial, sans-serif" fill="#57626a" font-size="15">MODELO GENERALISTA · editar campos e repetir elementos conforme o escopo</text><rect x="40" y="130" width="500" height="475" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="56" y="160" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Mapa da oferta</text><rect x="65" y="200" width="450" height="105" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="81" y="230" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Produtos e serviços</text><text x="81" y="267" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[ID + mecanismo]</text><rect x="65" y="325" width="450" height="105" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="81" y="355" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Aliviadores de dores</text><text x="81" y="392" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[ID + mecanismo]</text><rect x="65" y="450" width="450" height="105" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="81" y="480" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Criadores de ganhos</text><text x="81" y="517" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[ID + mecanismo]</text><rect x="660" y="130" width="500" height="475" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="676" y="160" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Perfil do cliente</text><rect x="685" y="200" width="450" height="105" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="701" y="230" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Tarefas</text><text x="701" y="267" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[ID + prioridade + evidência]</text><rect x="685" y="325" width="450" height="105" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="701" y="355" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Dores</text><text x="701" y="392" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[ID + prioridade + evidência]</text><rect x="685" y="450" width="450" height="105" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="701" y="480" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Ganhos</text><text x="701" y="517" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[ID + prioridade + evidência]</text><path d="M545,380 L655,380" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><text x="545" y="350" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Encaixe]</text><text x="40" y="730" font-family="Arial, sans-serif" fill="#57626a" font-size="15">Esquema de composição · campos entre colchetes são placeholders · sem dados empíricos</text></svg>