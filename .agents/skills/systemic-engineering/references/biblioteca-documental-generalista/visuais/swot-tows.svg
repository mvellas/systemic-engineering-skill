<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Matriz SWOT 2×2</title><desc id="desc">Forças e fraquezas na linha superior; oportunidades e ameaças na inferior. Texto alinhado à esquerda. Cores identificam quadrantes e não provam intensidade. Esquema generalista preenchível; não representa dados de um negócio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6b858b" /></marker></defs><rect width="1200" height="760" fill="white" /><text x="40" y="45" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">DOC-16 / SWOT e desdobramento TOWS</text><text x="40" y="76" font-family="Arial, sans-serif" fill="#57626a" font-size="15">MODELO GENERALISTA · editar campos e repetir elementos conforme o escopo</text><rect x="45" y="115" width="545" height="255" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="61" y="145" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">S · Forças internas</text><text x="61" y="332" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[ID + fator + evidência + implicação]</text><rect x="610" y="115" width="545" height="255" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="626" y="145" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">W · Fraquezas internas</text><text x="626" y="332" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[ID + fator + evidência + implicação]</text><rect x="45" y="390" width="545" height="255" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="61" y="420" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">O · Oportunidades externas</text><text x="61" y="607" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[ID + fator + evidência + implicação]</text><rect x="610" y="390" width="545" height="255" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="626" y="420" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">T · Ameaças externas</text><text x="626" y="607" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[ID + fator + evidência + implicação]</text><text x="40" y="730" font-family="Arial, sans-serif" fill="#57626a" font-size="15">Esquema de composição · campos entre colchetes são placeholders · sem dados empíricos</text></svg>