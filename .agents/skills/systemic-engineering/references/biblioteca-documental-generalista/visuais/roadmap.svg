<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Roadmap por trilhas</title><desc id="desc">Eixo horizontal de tempo, trilhas de trabalho no vertical, barras de duração e losangos para marcos. Sem datas, mostrar janelas T0/T+1 com a legenda Planejamento a definir. Esquema generalista preenchível; não representa dados de um negócio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6b858b" /></marker></defs><rect width="1200" height="760" fill="white" /><text x="40" y="45" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">DOC-13 / Roadmap do projeto</text><text x="40" y="76" font-family="Arial, sans-serif" fill="#57626a" font-size="15">MODELO GENERALISTA · editar campos e repetir elementos conforme o escopo</text><text x="330" y="140" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">T0</text><text x="555" y="140" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">T+1</text><text x="780" y="140" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">T+2</text><text x="1005" y="140" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">T+3</text><text x="45" y="245" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Trilha A]</text><path d="M290,250 L1130,250" stroke="#6b858b" stroke-width="2" fill="none" /><rect x="310" y="210" width="390" height="80" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="326" y="240" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Janela a confirmar]</text><path d="M750,230 l20,20 l-20,20 l-20,-20 Z" fill="#255b65" /><text x="45" y="375" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Trilha B]</text><path d="M290,380 L1130,380" stroke="#6b858b" stroke-width="2" fill="none" /><rect x="500" y="340" width="390" height="80" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="516" y="370" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Janela a confirmar]</text><path d="M910,360 l20,20 l-20,20 l-20,-20 Z" fill="#255b65" /><text x="45" y="505" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Trilha C]</text><path d="M290,510 L1130,510" stroke="#6b858b" stroke-width="2" fill="none" /><rect x="690" y="470" width="390" height="80" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="706" y="500" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Janela a confirmar]</text><path d="M1070,490 l20,20 l-20,20 l-20,-20 Z" fill="#255b65" /><text x="45" y="675" font-family="Arial, sans-serif" fill="#57626a" font-size="15">Janelas e posições ilustram a composição; não representam prazos aprovados.</text><text x="40" y="730" font-family="Arial, sans-serif" fill="#57626a" font-size="15">Esquema de composição · campos entre colchetes são placeholders · sem dados empíricos</text></svg>