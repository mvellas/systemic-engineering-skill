<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Jornada visual numerada</title><desc id="desc">Ícone ou cena por etapa, ação e ponto de contato; setas mostram progressão e retorno. Curva emocional é opcional e só recebe números quando houver escala e observações. Esquema generalista preenchível; não representa dados de um negócio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6b858b" /></marker></defs><rect width="1200" height="760" fill="white" /><text x="40" y="45" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">DOC-05 / Jornada do cliente</text><text x="40" y="76" font-family="Arial, sans-serif" fill="#57626a" font-size="15">MODELO GENERALISTA · editar campos e repetir elementos conforme o escopo</text><circle cx="190" cy="200" r="54" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="180" y="208" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">1</text><text x="60" y="285" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Descobrir</text><text x="60" y="315" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Ação e ponto de contato]</text><text x="60" y="342" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Fricção / evidência]</text><path d="M255,200 L410,200" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><circle cx="570" cy="200" r="54" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="560" y="208" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">2</text><text x="440" y="285" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Avaliar</text><text x="440" y="315" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Ação e ponto de contato]</text><text x="440" y="342" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Fricção / evidência]</text><path d="M635,200 L790,200" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><circle cx="950" cy="200" r="54" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="940" y="208" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">3</text><text x="820" y="285" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Aderir / comprar</text><text x="820" y="315" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Ação e ponto de contato]</text><text x="820" y="342" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Fricção / evidência]</text><circle cx="190" cy="480" r="54" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="180" y="488" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">4</text><text x="60" y="565" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Preparar</text><text x="60" y="595" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Ação e ponto de contato]</text><text x="60" y="622" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Fricção / evidência]</text><path d="M255,480 L410,480" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><circle cx="570" cy="480" r="54" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="560" y="488" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">5</text><text x="440" y="565" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Obter valor</text><text x="440" y="595" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Ação e ponto de contato]</text><text x="440" y="622" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Fricção / evidência]</text><path d="M635,480 L790,480" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><circle cx="950" cy="480" r="54" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="940" y="488" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">6</text><text x="820" y="565" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Retornar / ajuda</text><text x="820" y="595" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Ação e ponto de contato]</text><text x="820" y="622" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Fricção / evidência]</text><text x="70" y="690" font-family="Arial, sans-serif" fill="#57626a" font-size="15">Continuação: etapa 3 → etapa 4. Adaptar o número de etapas; a ordem é ilustrativa.</text><text x="40" y="730" font-family="Arial, sans-serif" fill="#57626a" font-size="15">Esquema de composição · campos entre colchetes são placeholders · sem dados empíricos</text></svg>