<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Árvore de pacotes de trabalho</title><desc id="desc">Projeto → entregas → pacotes. Não confundir ramos com ordem temporal. A ligação com PBS, RACI e roadmap é feita pelos IDs. Esquema generalista preenchível; não representa dados de um negócio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6b858b" /></marker></defs><rect width="1200" height="760" fill="white" /><text x="40" y="45" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">DOC-20 / Estrutura analítica do trabalho — WBS</text><text x="40" y="76" font-family="Arial, sans-serif" fill="#57626a" font-size="15">MODELO GENERALISTA · editar campos e repetir elementos conforme o escopo</text><rect x="400" y="125" width="400" height="95" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="416" y="155" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Escopo do projeto]</text><path d="M600,220 L600,280" stroke="#6b858b" stroke-width="2" fill="none" /><path d="M600,280 L210,280" stroke="#6b858b" stroke-width="2" fill="none" /><path d="M210,280 L210,330" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><rect x="40" y="330" width="340" height="115" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="56" y="360" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Entregável A]</text><text x="56" y="407" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Composição]</text><rect x="40" y="505" width="340" height="115" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="56" y="535" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Componente / pacote]</text><text x="56" y="582" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[ID + critério de aceitação]</text><path d="M210,445 L210,505" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><path d="M600,280 L595,280" stroke="#6b858b" stroke-width="2" fill="none" /><path d="M595,280 L595,330" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><rect x="425" y="330" width="340" height="115" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="441" y="360" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Entregável B]</text><text x="441" y="407" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Composição]</text><rect x="425" y="505" width="340" height="115" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="441" y="535" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Componente / pacote]</text><text x="441" y="582" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[ID + critério de aceitação]</text><path d="M595,445 L595,505" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><path d="M600,280 L980,280" stroke="#6b858b" stroke-width="2" fill="none" /><path d="M980,280 L980,330" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><rect x="810" y="330" width="340" height="115" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="826" y="360" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Entregável C]</text><text x="826" y="407" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Composição]</text><rect x="810" y="505" width="340" height="115" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="826" y="535" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Componente / pacote]</text><text x="826" y="582" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[ID + critério de aceitaçã