<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Painel de seis dimensões</title><desc id="desc">Seis cartões com fator, mecanismo e sinal de monitoramento. Matriz impacto × incerteza opcional com rubrica explícita; não usar radar com notas arbitrárias. Esquema generalista preenchível; não representa dados de um negócio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6b858b" /></marker></defs><rect width="1200" height="760" fill="white" /><text x="40" y="45" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">DOC-09 / Análise PESTEL</text><text x="40" y="76" font-family="Arial, sans-serif" fill="#57626a" font-size="15">MODELO GENERALISTA · editar campos e repetir elementos conforme o escopo</text><rect x="40" y="120" width="350" height="240" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="56" y="150" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Político</text><text x="56" y="322" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Registro + fonte + implicação]</text><rect x="425" y="120" width="350" height="240" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="441" y="150" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Econômico</text><text x="441" y="322" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Registro + fonte + implicação]</text><rect x="810" y="120" width="350" height="240" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="826" y="150" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Social</text><text x="826" y="322" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Registro + fonte + implicação]</text><rect x="40" y="390" width="350" height="240" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="56" y="420" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Tecnológico</text><text x="56" y="592" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Registro + fonte + implicação]</text><rect x="425" y="390" width="350" height="240" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="441" y="420" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Ambiental</text><text x="441" y="592" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Registro + fonte + implicação]</text><rect x="810" y="390" width="350" height="240" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="826" y="420" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Legal</text><text x="826" y="592" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Registro + fonte + implicação]</text><text x="40" y="730" font-family="Arial, sans-serif" fill="#57626a" font-size="15">Esquema de composição · campos entre colchetes são placeholders · sem dados empíricos</text></svg>