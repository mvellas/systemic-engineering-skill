<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Comparação de cenários e caixa</title><desc id="desc">Barras categóricas para alternativas e mesma unidade por gráfico; linha apenas para caixa em períodos reais. Painel de sensibilidade usa variações declaradas. Sem entradas, mostrar tabela de lacunas, não dados fabricados. Esquema generalista preenchível; não representa dados de um negócio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6b858b" /></marker></defs><rect width="1200" height="760" fill="white" /><text x="40" y="45" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">DOC-21 / Análise de mercado e viabilidade por cenários</text><text x="40" y="76" font-family="Arial, sans-serif" fill="#57626a" font-size="15">MODELO GENERALISTA · editar campos e repetir elementos conforme o escopo</text><rect x="45" y="125" width="1110" height="100" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="61" y="155" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Comparar alternativas na mesma base</text><text x="61" y="187" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Moeda] · [Período] · [Unidade] · [Premissas / observado / simulado]</text><rect x="45" y="270" width="350" height="210" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="61" y="300" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Cenário A]</text><text x="61" y="442" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Resultado e condição]</text><rect x="430" y="270" width="350" height="210" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="446" y="300" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Cenário B]</text><text x="446" y="442" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Resultado e condição]</text><rect x="815" y="270" width="350" height="210" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="831" y="300" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Não investir]</text><text x="831" y="442" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Resultado e condição]</text><rect x="45" y="520" width="1110" height="140" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="61" y="550" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Dados necessários antes de desenhar séries e barras</text><text x="61" y="622" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Entradas] → [Fórmula] → [Resultado] → [Limite] → [Decisão]</text><text x="40" y="730" font-family="Arial, sans-serif" fill="#57626a" font-size="15">Esquema de composição · campos entre colchetes são placeholders · sem dados empíricos</text></svg>