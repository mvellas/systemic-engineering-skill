<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Árvore institucional e de portfólio</title><desc id="desc">Organização no topo e ofertas/unidades abaixo. Conectores rotulados indicam natureza da relação. Não desenhar porcentagens ou controle societário sem documento. Esquema generalista preenchível; não representa dados de um negócio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6b858b" /></marker></defs><rect width="1200" height="760" fill="white" /><text x="40" y="45" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">DOC-19 / Estrutura institucional e de marcas</text><text x="40" y="76" font-family="Arial, sans-serif" fill="#57626a" font-size="15">MODELO GENERALISTA · editar campos e repetir elementos conforme o escopo</text><rect x="400" y="125" width="400" height="95" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="416" y="155" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Organização]</text><path d="M600,220 L600,280" stroke="#6b858b" stroke-width="2" fill="none" /><path d="M600,280 L270,280" stroke="#6b858b" stroke-width="2" fill="none" /><path d="M270,280 L270,330" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><rect x="100" y="330" width="340" height="115" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="116" y="360" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Marca ou produto A]</text><text x="116" y="407" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Natureza da relação]</text><path d="M600,280 L890,280" stroke="#6b858b" stroke-width="2" fill="none" /><path d="M890,280 L890,330" marker-end="url(#arrow)" stroke="#6b858b" stroke-width="2" fill="none" /><rect x="720" y="330" width="340" height="115" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="736" y="360" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">[Unidade ou oferta B]</text><text x="736" y="407" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Natureza da relação]</text><text x="110" y="560" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Identidade institucional] · [Registro aplicável] · [Contato público autorizado]</text><text x="40" y="730" font-family="Arial, sans-serif" fill="#57626a" font-size="15">Esquema de composição · campos entre colchetes são placeholders · sem dados empíricos</text></svg>