<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Mapa de sete domínios</title><desc id="desc">Persona ao centro, quatro perspectivas ao redor e faixa inferior para dores, ganhos e expectativas. Cores apenas agrupam domínios, sem sugerir intensidade. Esquema generalista preenchível; não representa dados de um negócio.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#6b858b" /></marker></defs><rect width="1200" height="760" fill="white" /><text x="40" y="45" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">DOC-06 / Carta e mapa de empatia</text><text x="40" y="76" font-family="Arial, sans-serif" fill="#57626a" font-size="15">MODELO GENERALISTA · editar campos e repetir elementos conforme o escopo</text><rect x="40" y="120" width="350" height="240" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="56" y="150" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Pensa e sente</text><text x="56" y="322" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Registro + fonte + implicação]</text><rect x="425" y="120" width="350" height="240" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="441" y="150" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Vê</text><text x="441" y="322" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Registro + fonte + implicação]</text><rect x="810" y="120" width="350" height="240" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="826" y="150" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Ouve</text><text x="826" y="322" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Registro + fonte + implicação]</text><rect x="40" y="390" width="350" height="240" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="56" y="420" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Diz e faz</text><text x="56" y="592" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Registro + fonte + implicação]</text><rect x="425" y="390" width="350" height="240" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="441" y="420" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Dores</text><text x="441" y="592" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Registro + fonte + implicação]</text><rect x="810" y="390" width="350" height="240" rx="5" stroke="#c8d1d4" fill="#eff5f4" stroke-width="1.5" /><text x="826" y="420" font-family="Arial, sans-serif" fill="#20282c" font-size="18" font-weight="bold">Ganhos e expectativas</text><text x="826" y="592" font-family="Arial, sans-serif" fill="#57626a" font-size="15">[Registro + fonte + implicação]</text><text x="40" y="730" font-family="Arial, sans-serif" fill="#57626a" font-size="15">Esquema de composição · campos entre colchetes são placeholders · sem dados empíricos</text></svg>